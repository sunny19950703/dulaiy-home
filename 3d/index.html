<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>度拉家居 · 3D 户型体验（示例）</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#2b2520;background:#efe9df;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-rows:64px 1fr;grid-template-columns:268px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#2f2621;color:#f3e7d3}
.brand{display:flex;align-items:baseline;gap:14px}
.brand b{font-size:20px;letter-spacing:6px;font-weight:600}
.brand span{font-size:14px;color:#d9b77e}
.brand em{font-style:normal;font-size:12px;color:#2f2621;background:#c9a063;border-radius:10px;padding:2px 9px}
.views{display:flex;background:#463a33;border-radius:22px;padding:4px}
.views button{border:0;background:transparent;color:#e6d6bb;font:inherit;font-size:15px;padding:8px 18px;border-radius:18px;cursor:pointer}
.views button.on{background:#f3e7d3;color:#2f2621;font-weight:600}
aside{background:#faf6ef;border-right:1px solid #e3d6bf;overflow-y:auto;padding:16px 16px 24px}
aside h3{font-size:14px;color:#8a6d45;margin:18px 0 10px;letter-spacing:1px}
aside h3:first-child{margin-top:4px}
.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tools button,.lib button,.act button{border:1px solid #e3d6bf;background:#fff;border-radius:10px;font:inherit;font-size:13px;color:#3a2f28;cursor:pointer;padding:9px 4px}
.tools button.on{background:#2f2621;color:#f3e7d3;border-color:#2f2621}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib button{text-align:left;padding:9px 10px}
.lib button i{font-style:normal;display:inline-block;width:22px}
.mats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mat{cursor:pointer;text-align:center;font-size:11px;color:#6b5236}
.mat div{height:40px;border-radius:8px;border:2px solid transparent;background-size:cover;margin-bottom:4px}
.mat.on div{border-color:#b0762a;box-shadow:0 0 0 2px #fff inset}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.upload{width:100%;margin-top:4px;border:1px dashed #c9a063!important;color:#8a5f2a!important;background:#fbf3e4!important}
.note{font-size:12px;color:#8a7a66;line-height:1.6;margin-top:8px}
#removed{font-size:12.5px;color:#a0442f;line-height:1.7;margin-top:6px}
#stage{position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.rl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;color:#3a2f28;text-shadow:0 0 3px #fff,0 0 6px #fff;transition:opacity .3s}
.rl b{display:block;font-size:15px}
.rl small{font-size:12px;color:#7a6a55}
.dim{position:absolute;transform:translate(-50%,-50%);font-size:13px;color:#8a5f2a;background:#efe9df;padding:0 6px}
.ml{position:absolute;transform:translate(-50%,-130%);font-size:13px;color:#fff;background:#b0442f;border-radius:6px;padding:2px 8px}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(47,38,33,.86);color:#f3e7d3;font-size:14px;padding:9px 18px;border-radius:20px;white-space:nowrap;pointer-events:none}
#legend{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.9);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.9;color:#3a2f28}
#legend span{display:inline-block;width:22px;height:6px;border-radius:2px;margin-right:8px;vertical-align:2px}
#selbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;border-radius:22px;box-shadow:0 3px 14px rgba(0,0,0,.12);padding:6px 8px 6px 18px;display:none;align-items:center;gap:8px;font-size:14px}
#selbar button{border:0;border-radius:16px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;background:#efe6d6;color:#3a2f28}
#selbar button.del{background:#f6e0da;color:#a0442f}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#a0442f;color:#fff;border-radius:18px;padding:8px 18px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
#walkui{position:absolute;inset:0;pointer-events:none;display:none}
#pad{position:absolute;left:24px;bottom:24px;width:150px;height:150px;pointer-events:auto}
#pad button{position:absolute;width:50px;height:50px;border-radius:50%;border:0;background:rgba(47,38,33,.7);color:#fff;font-size:20px;cursor:pointer}
#exitwalk{position:absolute;right:20px;top:14px;pointer-events:auto;border:0;border-radius:20px;background:#2f2621;color:#f3e7d3;font:inherit;font-size:14px;padding:9px 18px;cursor:pointer}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8)}
@media (max-width:900px) and (orientation:portrait),(max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 230px}
 header{grid-column:1;padding:0 10px}
 .brand span,.brand em{display:none}
 .views button{padding:7px 10px;font-size:13px}
 aside{grid-row:3;border-right:0;border-top:1px solid #e3d6bf;padding:10px}
 #legend{display:none}
 #hint{font-size:12px;white-space:normal;width:90%;text-align:center}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="brand"><b>DULAIY</b><span>度拉家居 · 3D 户型体验</span><em>示例户型</em></div>
  <div class="views">
   <button data-v="2d" class="on">2D 平面</button><button data-v="3d">3D 俯瞰</button><button data-v="walk">进屋漫游</button>
  </div>
 </header>
 <aside>
  <h3>工具</h3>
  <div class="tools">
   <button data-t="select" class="on">摆家具</button><button data-t="wall">拆改墙体</button><button data-t="measure">测量</button>
  </div>
  <h3>家具库 · 点一下放进户型</h3>
  <div class="lib" id="lib"></div>
  <h3>地面材质 · 选好后点房间</h3>
  <div class="mats" id="mats"></div>
  <h3>方案</h3>
  <div class="act">
   <button id="reset">恢复原始户型</button><button id="clearm">清除测量</button>
  </div>
  <div id="removed"></div>
  <button class="upload act" id="upload">＋ 上传业主户型图</button>
  <div class="note">本页是一套约 180㎡ 的示例大平层。正式使用时，按业主提供的户型图尺寸还原，再和业主一起调整方案。</div>
 </aside>
 <div id="stage">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="legend"><div><span style="background:#3d342d"></span>承重墙（不可拆）</div><div><span style="background:#a39584"></span>非承重墙（可拆改）</div><div><span style="background:repeating-linear-gradient(90deg,#c0392b 0 4px,transparent 4px 7px)"></span>已拆除</div><div><span style="background:#9cc7e0"></span>落地窗</div></div>
  <div id="selbar"><span id="selname">沙发</span><button id="rot">旋转 90°</button><button class="del" id="del">删除</button></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="walkui"><div id="cross"></div><button id="exitwalk">退出漫游</button>
   <div id="pad"><button data-k="f" style="left:50px;top:0">▲</button><button data-k="l" style="left:0;top:50px">◀</button><button data-k="r" style="left:100px;top:50px">▶</button><button data-k="b" style="left:50px;top:100px">▼</button></div>
  </div>
 </div>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
// ---------------- 户型数据（单位：米，x 向东，z 向南，原点在西北角） ----------------
const PW = 18, PD = 10, CX = PW / 2, CZ = PD / 2, WALL_H = 2.8, FLAT_H = 0.12;
const ROOMS = [
  {id:'living', name:'客厅', x0:0, z0:5, x1:7, z1:10, mat:'oak'},
  {id:'dining', name:'餐厅', x0:7, z0:5, x1:11, z1:10, mat:'oak'},
  {id:'bed2', name:'次卧', x0:0, z0:0, x1:4, z1:5, mat:'oak'},
  {id:'study', name:'书房', x0:4, z0:0, x1:7.5, z1:5, mat:'oak'},
  {id:'kitchen', name:'中西厨', x0:7.5, z0:0, x1:11, z1:5, mat:'tile'},
  {id:'foyer', name:'玄关', x0:11, z0:0, x1:13.5, z1:3, mat:'marble'},
  {id:'bath', name:'公卫', x0:13.5, z0:0, x1:15.5, z1:3, mat:'tile'},
  {id:'closet', name:'衣帽间', x0:15.5, z0:0, x1:18, z1:3, mat:'oak'},
  {id:'hall', name:'走廊', x0:11, z0:3, x1:18, z1:5, mat:'oak'},
  {id:'master', name:'主卧', x0:11, z0:5, x1:18, z1:10, mat:'oak'},
];
// kind: outer 外墙 / bear 承重墙 / part 非承重墙 / glass 落地窗；group 相同的一起拆
const WALLS = [
  {a:[0,0], b:[11.7,0], kind:'outer'}, {a:[12.8,0], b:[18,0], kind:'outer'},
  {a:[0,0], b:[0,10], kind:'outer'}, {a:[18,0], b:[18,10], kind:'outer'},
  {a:[0,10], b:[18,10], kind:'glass'},
  {a:[4,0], b:[4,5], kind:'bear'},
  {a:[11,0], b:[11,3], kind:'bear'}, {a:[11,5], b:[11,10], kind:'bear'},
  {a:[7.5,0], b:[7.5,5], kind:'part', group:'书房与厨房之间的墙'},
  {a:[0,5], b:[2.8,5], kind:'part', group:'次卧与客厅之间的墙'}, {a:[3.7,5], b:[4,5], kind:'part', group:'次卧与客厅之间的墙'},
  {a:[4,5], b:[4.3,5], kind:'part', group:'书房与客厅之间的墙'}, {a:[5.2,5], b:[7.5,5], kind:'part', group:'书房与客厅之间的墙'},
  {a:[7.5,5], b:[9,5], kind:'part', group:'厨房与餐厅之间的墙'}, {a:[10.2,5], b:[11,5], kind:'part', group:'厨房与餐厅之间的墙'},
  {a:[13.5,0], b:[13.5,3], kind:'part', group:'玄关与公卫之间的墙'},
  {a:[15.5,0], b:[15.5,3], kind:'part', group:'公卫与衣帽间之间的墙'},
  {a:[13.5,3], b:[14,3], kind:'part', group:'公卫门边墙'}, {a:[14.8,3], b:[15.5,3], kind:'part', group:'公卫门边墙'},
  {a:[15.5,3], b:[16,3], kind:'part', group:'衣帽间门边墙'}, {a:[16.9,3], b:[18,3], kind:'part', group:'衣帽间门边墙'},
  {a:[11,5], b:[12,5], kind:'part', group:'主卧与走廊之间的墙'}, {a:[13,5], b:[18,5], kind:'part', group:'主卧与走廊之间的墙'},
];
// 门：铰链点、门宽、开向（门扇沿墙方向 +1/-1，摆向 +1/-1）
const DOORS = [
  {h:[12.8,0], w:1.1, axis:'x', along:-1, swing:1},
  {h:[3.7,5], w:0.9, axis:'x', along:-1, swing:-1},
  {h:[5.2,5], w:0.9, axis:'x', along:-1, swing:-1},
  {h:[14.8,3], w:0.8, axis:'x', along:-1, swing:-1},
  {h:[16.9,3], w:0.9, axis:'x', along:-1, swing:-1},
  {h:[13,5], w:1.0, axis:'x', along:-1, swing:1},
];
const START_FURN = [
  ['tv', 3.5, 5.35, 0], ['sofa', 3.5, 8.6, Math.PI], ['coffee', 3.5, 7.05, 0], ['rug', 3.5, 7.3, 0], ['chair', 1.1, 7.1, Math.PI/2], ['plant', 6.4, 9.4, 0],
  ['dining', 9, 7.6, 0], ['plant', 7.6, 9.4, 0],
  ['bed', 14.5, 6.25, 0], ['wardrobe', 17.65, 7.5, -Math.PI/2],
  ['bedS', 2, 1.15, 0], ['desk', 5.75, 0.55, 0], ['shelf', 7.25, 2.5, -Math.PI/2],
  ['counter', 9.25, 0.35, 0], ['island', 9.25, 3.0, 0],
  ['cabinet', 12.25, 0.3, 0], ['vanity', 14.5, 0.3, 0], ['wardrobe', 16.75, 0.35, 0],
];

// ---------------- 基础场景 ----------------
const canvas = document.getElementById('c'), stage = document.getElementById('stage'), labelsEl = document.getElementById('labels');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#efe9df');
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 400);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12; controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 6; controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight(0xfffaf2, 0xcdbda4, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dd, 0.62);
sun.position.set(-6, 30, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-14, right:14, top:12, bottom:-12, near:1, far:60});
sun.shadow.bias = -0.0008; scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.1));
const fill = new THREE.DirectionalLight(0xfff6ea, 0.32); fill.position.set(-14, 9, 18); scene.add(fill);

const W = (x, z, y = 0) => new THREE.Vector3(x - CX, y, z - CZ);   // 平面坐标 → 场景坐标
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), new THREE.MeshStandardMaterial({color:'#e8e0d2', roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);
// 南侧阳台
const deck = new THREE.Mesh(new THREE.PlaneGeometry(18, 1.6), new THREE.MeshStandardMaterial({color:'#d8cfc1', roughness:.9}));
deck.rotation.x = -Math.PI/2; deck.position.copy(W(9, 10.8, -0.005)); deck.receiveShadow = true; scene.add(deck);

// ---------------- 地面材质（画布生成） ----------------
function tex(draw) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); draw(g);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}
function rnd(s){ return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function planks(base, dark, seed) {
  return g => { const r = rnd(seed); g.fillStyle = base; g.fillRect(0,0,512,512);
    for (let row = 0; row < 8; row++) { let x = -r()*300;
      while (x < 512) { const len = 180 + r()*220; const sh = (r()-.5)*28;
        g.fillStyle = `rgba(${sh>0?255:0},${sh>0?240:0},${sh>0?220:0},${Math.abs(sh)/100})`; g.fillRect(x, row*64, len, 64);
        g.strokeStyle = dark; g.globalAlpha = .18; for (let k = 0; k < 6; k++) { g.beginPath(); const y = row*64 + 6 + r()*52; g.moveTo(x, y); g.bezierCurveTo(x+len*.3, y+(r()-.5)*8, x+len*.6, y+(r()-.5)*8, x+len, y); g.stroke(); }
        g.globalAlpha = .55; g.fillStyle = dark; g.fillRect(x, row*64, 2, 64); g.globalAlpha = 1; x += len; }
      g.fillStyle = dark; g.globalAlpha = .5; g.fillRect(0, row*64, 512, 1.5); g.globalAlpha = 1; } };
}
const MATS = {
  oak:   {name:'浅橡木', t: tex(planks('#d9bb92', '#8a6440', 7))},
  walnut:{name:'胡桃木', t: tex(planks('#7b5337', '#3b2415', 11))},
  marble:{name:'大理石', t: tex(g => { const r = rnd(3); g.fillStyle = '#f3f0ea'; g.fillRect(0,0,512,512);
      for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(120,115,110,${.12 + r()*.25})`; g.lineWidth = .6 + r()*2; g.beginPath(); let x = r()*512, y = r()*512; g.moveTo(x, y);
        for (let k = 0; k < 6; k++) { x += (r()-.3)*140; y += (r()-.5)*140; g.lineTo(x, y); } g.stroke(); }
      g.strokeStyle = 'rgba(160,150,140,.35)'; g.lineWidth = 1; for (let i = 0; i <= 512; i += 256) { g.strokeRect(i, 0, 256, 512); g.strokeRect(0, i, 512, 256); } })},
  micro: {name:'微水泥', t: tex(g => { const r = rnd(5); g.fillStyle = '#bfb8ae'; g.fillRect(0,0,512,512);
      for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(${r()>.5?255:60},${r()>.5?250:55},${r()>.5?240:50},${r()*.08})`; g.fillRect(r()*512, r()*512, 2 + r()*10, 2 + r()*10); } })},
  tile:  {name:'瓷砖', t: tex(g => { g.fillStyle = '#e6e1d9'; g.fillRect(0,0,512,512); g.strokeStyle = '#c9c1b5'; g.lineWidth = 3;
      for (let i = 0; i <= 512; i += 128) { g.beginPath(); g.moveTo(i,0); g.lineTo(i,512); g.stroke(); g.beginPath(); g.moveTo(0,i); g.lineTo(512,i); g.stroke(); } })},
};
function floorMat(key, w, d) {
  const t = MATS[key].t.clone(); t.needsUpdate = true; t.repeat.set(w/2, d/2);
  return new THREE.MeshStandardMaterial({map:t, roughness: key === 'marble' ? .35 : .75, metalness:0});
}

// ---------------- 房间地面 ----------------
const roomMeshes = [];
function buildRooms() {
  ROOMS.forEach(r => {
    const w = r.x1 - r.x0, d = r.z1 - r.z0;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat(r.mat, w, d));
    m.rotation.x = -Math.PI/2; m.position.copy(W(r.x0 + w/2, r.z0 + d/2, 0.002)); m.receiveShadow = true;
    m.userData.room = r; r.mesh = m; scene.add(m); roomMeshes.push(m);
    r.area = w * d;
  });
}
function setRoomMat(r, key) { r.mat = key; const w = r.x1 - r.x0, d = r.z1 - r.z0; r.mesh.material.dispose(); r.mesh.material = floorMat(key, w, d); }

// ---------------- 墙体 ----------------
const wallMeshes = []; let wallH = FLAT_H;
const TOP = {outer:'#3d342d', bear:'#3d342d', part:'#a39584', glass:'#9cc7e0'};
function buildWalls() {
  WALLS.forEach((w, i) => {
    const [ax, az] = w.a, [bx, bz] = w.b, len = Math.hypot(bx-ax, bz-az);
    const t = w.kind === 'outer' ? 0.24 : w.kind === 'bear' ? 0.2 : w.kind === 'glass' ? 0.08 : 0.12;
    const ext = w.kind === 'glass' ? 0 : t;   // 端头稍微延长，接缝更干净
    w.t = t; w.len = len;
    let mesh;
    if (w.kind === 'glass') {
      mesh = new THREE.Group();
      const glass = new THREE.Mesh(new THREE.BoxGeometry(len, 1, t), new THREE.MeshStandardMaterial({color:'#bcd9e8', transparent:true, opacity:.28, roughness:.05, metalness:.2}));
      mesh.add(glass); w.glass = glass;
      const frameMat = new THREE.MeshStandardMaterial({color:'#5a4c40', roughness:.6});
      w.posts = [];
      for (let k = 0; k <= Math.round(len / 1.8); k++) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.1), frameMat); p.position.x = -len/2 + k * len / Math.round(len/1.8); p.castShadow = true; mesh.add(p); w.posts.push(p); }
    } else {
      const side = new THREE.MeshStandardMaterial({color:'#f5f0e8', roughness:.9});
      const top = new THREE.MeshStandardMaterial({color:TOP[w.kind], roughness:.9});
      mesh = new THREE.Mesh(new THREE.BoxGeometry(len + ext, 1, t), [side, side, top, side, side, side]);
      mesh.castShadow = true; mesh.receiveShadow = true; w.mats = [side, top];
    }
    mesh.position.copy(W((ax+bx)/2, (az+bz)/2)); mesh.rotation.y = -Math.atan2(bz-az, bx-ax);
    mesh.userData.wall = w; w.mesh = mesh; scene.add(mesh); wallMeshes.push(mesh);
    // 拆除后的虚线轮廓
    const pts = [[-len/2,-t/2],[len/2,-t/2],[len/2,t/2],[-len/2,t/2],[-len/2,-t/2]].map(p => new THREE.Vector3(p[0], 0.03, p[1]));
    const ghost = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({color:'#c0392b', dashSize:.12, gapSize:.08}));
    ghost.computeLineDistances(); ghost.position.copy(mesh.position); ghost.rotation.y = mesh.rotation.y; ghost.visible = false; scene.add(ghost); w.ghost = ghost;
  });
  applyWallH();
}
function applyWallH() {
  WALLS.forEach(w => {
    const h = wallH;
    if (w.kind === 'glass') { w.glass.scale.y = h; w.glass.position.y = h/2; w.posts.forEach(p => { p.scale.y = h; p.position.y = h/2; }); }
    else { w.mesh.scale.y = h; w.mesh.position.y = h/2; }
  });
}
function setRemoved(group, removed) {
  WALLS.filter(w => w.group === group).forEach(w => { w.removed = removed; w.mesh.visible = !removed; w.ghost.visible = removed; });

function fit2d() {

  return need / 2 / Math.tan(THREE.MathUtils.degToRad(15));

const PRESET = {

  '3d': () => ({pos: new THREE.Vector3(-11, 17, 19), tgt: new THREE.Vector3(0.5, 0, 0.5), h: WALL_H, fov: 30}),
  'walk': () => ({pos: W(7.4, 5.7, 1.6), tgt: W(1.5, 9.2, 1.25), h: WALL_H, fov: 62}),

let anim = null;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function goView(v) {
  const from = {pos: camera.position.clone(), tgt: controls.target.clone(), h: wallH, fov: camera.fov};
  if (view === 'walk') { from.tgt = camera.position.clone().add(new THREE.Vector3(-Math.sin(yaw), Math.sin(pitch), -Math.cos(yaw))); }
  ceiling.visible = false;
  const to = PRESET[v](); const prev = view; view = v;
  document.querySelectorAll('.views button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  controls.enabled = false; walkActive = false; document.getElementById('walkui').style.display = 'none';
  document.getElementById('legend').style.display = v === '2d' && getComputedStyle(document.querySelector('aside')).gridRow !== '3' ? 'block' : 'none';
  select(null);
  anim = {t0: performance.now(), dur: prev === v ? 400 : 1600, from, to, done() {

}

  const k = Math.min(1, (now - anim.t0) / anim.dur), e = ease(k);
  // 墙体：进 3D 时先长高，退回 2D 时后收起
  const hk = anim.to.h > anim.from.h ? Math.min(1, k * 1.6) : Math.max(0, k * 1.6 - .6);
  wallH = anim.from.h + (anim.to.h - anim.from.h) * ease(hk); applyWallH();
  camera.position.lerpVectors(anim.from.pos, anim.to.pos, e);

let walkActive = false, yaw = 0, pitch = 0; const keys = {};
function startWalk() {

  yaw = Math.atan2(-dir.x, -dir.z); pitch = Math.asin(dir.normalize().y);
}
function blocked(p) {
  const x = p.x + CX, z = p.z + CZ;
  if (x < 0.3 || x > PW - 0.3 || z < 0.3 || z > PD - 0.3) return true;
  return WALLS.some(w => { if (w.removed) return false; const [ax, az] = w.a, [bx, bz] = w.b;
    const vx = bx-ax, vz = bz-az, L = vx*vx + vz*vz, t = Math.max(0, Math.min(1, ((x-ax)*vx + (z-az)*vz) / L));
    return Math.hypot(x - (ax + t*vx), z - (az + t*vz)) < w.t/2 + 0.25; });
}
function stepWalk(dt) {
  if (!walkActive) return;

  const s = (keys.r||keys.KeyD||keys.ArrowRight?1:0) - (keys.l||keys.KeyA||keys.ArrowLeft?1:0);
  if (f || s) {
    const sp = 2.0 * dt, fw = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), rt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    const move = fw.multiplyScalar(f * sp).add(rt.multiplyScalar(s * sp));
    const nx = camera.position.clone(); nx.x += move.x; if (!blocked(nx)) camera.position.x = nx.x;
    const nz = camera.position.clone(); nz.z += move.z; if (!blocked(nz)) camera.position.z = nz.z;

addEventListener('keyup', e => { keys[e.code] = false; });

LIB.forEach(k => { const b = document.createElement('button'); b.innerHTML = `<i>${FURN[k].icon}</i>${FURN[k].name}`;
  b.onclick = () => { if (view === 'walk') goView('3d'); setTool('select'); const t = controls.target;
    const g = addItem(k, t.x + CX + (Math.random() - .5), t.z + CZ + (Math.random() - .5)); select(g); toast('已放入' + FURN[k].name + '，拖动到合适的位置'); };
  lib.appendChild(b); });
const mats = document.getElementById('mats');
Object.entries(MATS).forEach(([k, m]) => { const d = document.createElement('div'); d.className = 'mat';
  d.innerHTML = `<div style="background-image:url(${m.t.image.toDataURL()})"></div>${m.name}`;
  d.onclick = () => { if (view === 'walk') goView('3d'); setTool('floor'); floorPick = k; document.querySelectorAll('.mat').forEach(x => x.classList.toggle('on', x === d)); };
  mats.appendChild(d); });
document.getElementById('clearm').onclick = () => { measures.forEach(m => { scene.remove(m.l); m.lab.el.remove(); labels.splice(labels.indexOf(m.lab), 1); }); measures.length = 0; };
document.getElementById('reset').onclick = () => {
  [...items].forEach(removeItem); START_FURN.forEach(f => addItem(...f)); select(null);
  [...new Set(WALLS.filter(w => w.removed).map(w => w.group))].forEach(g => setRemoved(g, false));
  const orig = {living:'oak', dining:'oak', bed2:'oak', study:'oak', kitchen:'tile', foyer:'marble', bath:'tile', closet:'oak', hall:'oak', master:'oak'};
  ROOMS.forEach(r => setRoomMat(r, orig[r.id])); toast('已恢复原始户型');
};
document.getElementById('upload').onclick = () => toast('正式版：上传业主户型图，按尺寸还原成这样的在线户型');

// ---------------- 启动 ----------------
buildRooms(); buildWalls(); buildDoors(); buildLabels(); START_FURN.forEach(f => addItem(...f));
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); if (view === '2d' && !anim) { camera.position.set(0, fit2d(), 0.001); controls.target.set(0, 0, 0); } }
addEventListener('resize', resize); resize();
controls.enableRotate = false; camera.lookAt(0, 0, 0); updateHint();
const tmp = new THREE.Vector3(); let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  stepAnim(now);
  if (walkActive) stepWalk(dt); else if (!anim && controls.enabled) controls.update();
  const flat = wallH < 0.5, w = stage.clientWidth, h = stage.clientHeight;
  doorLines.forEach(l => l.visible = flat); dimLines.forEach(l => l.visible = flat);
  labels.forEach(l => {
    tmp.copy(l.pos).project(camera);
    const vis = tmp.z < 1 && !walkActive && (!l.only2d || flat);
    l.el.style.display = vis ? 'block' : 'none';
    if (vis) { l.el.style.left = ((tmp.x + 1) / 2 * w) + 'px'; l.el.style.top = ((1 - tmp.y) / 2 * h) + 'px'; l.el.style.opacity = flat ? 1 : .8; }
  });
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
